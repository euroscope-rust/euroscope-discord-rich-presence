---
name: release-create

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.0.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          if ! printf '%s' "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 0.0.2 (got '${{ inputs.version }}')"
            exit 1
          fi
      # A GitHub App token (not the default GITHUB_TOKEN) is required so that the
      # tag push below actually triggers the `release-on-tag` workflow.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIV_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Ensure tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag ${{ inputs.version }} already exists"
            exit 1
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Bump version
        run: |
          sed -i -E 's/^version = "[^"]*"/version = "${{ inputs.version }}"/' Cargo.toml
          cargo update --workspace
      - name: Commit, tag and push
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git commit -am "release: ${{ inputs.version }}"
          git tag "${{ inputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "refs/tags/${{ inputs.version }}"
