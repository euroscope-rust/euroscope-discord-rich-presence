---
name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        job:
          - lint
        include:
          - job: fmt
            toolchain: nightly
            components: rustfmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - if: ${{ matrix.toolchain }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: i686-pc-windows-msvc
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.components }}
      - if: ${{ ! matrix.toolchain }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: i686-pc-windows-msvc
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: just
      - name: Download EuroScope installer
        run: |
          $url = "https://euroscope.hu/install/EuroScopeSetup.3.2.13.msi"
          Write-Host "Downloading EuroScope from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\EuroScopeSetup.msi"
      - name: Install EuroScope
        run: |
          $msi = "$env:RUNNER_TEMP\EuroScopeSetup.msi"
          $log = "$env:RUNNER_TEMP\euroscope-install.log"
          Write-Host "Installing EuroScope..."
          $p = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "msiexec failed with exit code $($p.ExitCode)"
            Get-Content $log -Tail 50
            exit $p.ExitCode
          }
          Write-Host "EuroScope installed."
      - run: just ci-${{ matrix.job }}